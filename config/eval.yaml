# Evaluation settings.
dataset: datasets/golden.jsonl
db_path: data/results.db
reports_dir: reports

generation:
  repeats: 3          # run each prompt N times to measure non-determinism
  temperature: 0.2    # fixed low temperature
  max_tokens: 512
  system_prompt: "You are a helpful, accurate assistant. Answer concisely."

retry:
  max_attempts: 5
  base_delay_s: 1.0
  max_delay_s: 30.0
  circuit_breaker_failures: 5   # consecutive failures before a model is skipped for the run

judge:
  enabled: true
  # Free-tier default. Groq's gpt-oss-120b answered in 1-2 s; free Gemini Flash-Lite was
  # overloaded (503s, ~25 s per judgement) on 2026-11-03. Bias note: it shares a model
  # family with the groq-gpt-oss-20b candidate (possible self-preference).
  model: groq/openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  temperature: 0.0
  # correctness and faithfulness cost one judge call per answer; relevancy costs 2-3.
  metrics: [correctness, faithfulness]
  # Judge only the first N repeats per prompt to save free-tier quota.
  max_repeats_judged: 1
  rpm: 25

drift:
  baseline: rolling      # "rolling" or a run_id; a run marked is_baseline wins over rolling
  rolling_k: 3
  rolling_stat: mean     # per-prompt combination of baseline runs: mean (unbiased) or median
  quality_threshold: 0.10           # per model, all prompts
  category_quality_threshold: 0.20  # per model x category (~8 prompts: noisier)
  bonferroni: true                  # adjust per-category CI for the number of categories
  latency_threshold: 0.50
  cost_threshold: 0.25
  rate_threshold: 0.10
  min_prompts: 5
  bootstrap_samples: 2000
  confidence: 0.95
  seed: 1234
