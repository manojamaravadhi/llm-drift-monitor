# Same mock models as demo_models.yaml, but mock-good is degraded:
# 40% more wrong answers, 1.8x slower and wordier. Used by `make drift-demo`.
models:
  - name: mock-good
    provider: mock
    model: mock/good
    enabled: true
    rpm: 100000
    params: {quality: 0.92, degrade: 0.4, latency_ms: 450, latency_jitter_ms: 120,
             latency_multiplier: 1.8, output_multiplier: 1.5, tokens_per_word: 1.3}
  - name: mock-fast
    provider: mock
    model: mock/fast
    enabled: true
    rpm: 100000
    params: {quality: 0.78, latency_ms: 180, latency_jitter_ms: 40, tokens_per_word: 1.3}
