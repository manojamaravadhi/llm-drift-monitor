name: Weekly evaluation

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      inject_degradation:
        description: "Use the harmful system prompt (drift demo on real APIs)"
        type: boolean
        default: false

permissions:
  contents: write   # push the results DB to the eval-history branch
  issues: write     # open an issue when drift is detected

concurrency:
  group: weekly-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HISTORY_BRANCH: eval-history
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "No GEMINI_API_KEY or GROQ_API_KEY secret configured; skipping evaluation."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        run: pip install -e .

      - name: Restore results history
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p data
          if git fetch --depth=1 origin "$HISTORY_BRANCH"; then
            git show "origin/$HISTORY_BRANCH:results.db" > data/results.db || rm -f data/results.db
          fi
          ls -la data

      - name: Run evaluation (API models only; Ollama is skipped in CI)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          FLAGS="--no-cache --fresh --label weekly-ci"
          if [ "${{ inputs.inject_degradation }}" = "true" ]; then FLAGS="$FLAGS --inject-degradation"; fi
          llmdrift run --models gemini-3.5-flash-lite,groq-gpt-oss-20b $FLAGS
          llmdrift report

      - name: Drift check
        id: drift
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set +e
          llmdrift drift
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then echo "No baseline yet (first run); nothing to compare."; fi

      - uses: actions/upload-artifact@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: eval-reports-${{ github.run_id }}
          path: |
            reports/
            data/results.db

      - name: Save results history to the eval-history branch
        if: steps.secrets.outputs.ok == 'true'
        run: |
          cp data/results.db /tmp/results.db
          cp reports/drift_report.md /tmp/drift_report.md 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "$HISTORY_BRANCH" >/dev/null; then
            git checkout -B "$HISTORY_BRANCH" "origin/$HISTORY_BRANCH"
          else
            git checkout --orphan "$HISTORY_BRANCH"
            git rm -rf --quiet .
          fi
          cp /tmp/results.db results.db
          cp /tmp/drift_report.md latest_drift_report.md 2>/dev/null || true
          git add results.db latest_drift_report.md 2>/dev/null || git add results.db
          git commit -m "Weekly eval ${{ github.run_id }}" || echo "nothing to commit"
          git push origin "$HISTORY_BRANCH"

      - name: Open an issue on drift
        if: steps.secrets.outputs.ok == 'true' && steps.drift.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Drift detected in weekly evaluation ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/drift_report.md

      - name: Fail on drift
        if: steps.secrets.outputs.ok == 'true' && steps.drift.outputs.code == '1'
        run: |
          echo "Drift detected; see the uploaded report and the opened issue."
          exit 1
