[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdrift"
version = "0.1.0"
description = "Compare LLMs on a golden dataset (quality, latency, cost) and detect drift over time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "litellm==1.106.6",
  "deepeval==4.3.2",
  "sqlalchemy==2.1.6",
  "typer==0.27.3",
  "pydantic==2.14.2",
  "pyyaml==6.0.3",
  "python-dotenv==1.2.4",
  "numpy==2.5.4",
  "pandas==3.1.0",
  "streamlit==1.66.1",
  "plotly==7.1.0",
  "tabulate==0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "types-PyYAML==6.0.12.20261103",
  "pandas-stubs==3.1.0.261029",
  "pre-commit==4.7.0",
]

docs = ["playwright==1.64.1"]

[project.scripts]
llmdrift = "llmdrift.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dashboard", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "D401", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"dashboard/**" = ["D", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "dashboard", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["litellm.*", "deepeval.*", "plotly.*", "streamlit.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: hits real provider APIs (needs keys)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["llmdrift"]

[tool.coverage.report]
show_missing = true
skip_covered = true
